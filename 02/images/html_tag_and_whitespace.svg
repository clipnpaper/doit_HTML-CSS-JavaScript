<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redTitleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="greenTitleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow2_3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" rx="16" fill="url(#bgGrad2_3)"/>
  <rect x="1" y="1" width="918" height="458" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    태그(Tag)가 반드시 필요한 이유: 일반 텍스트 vs HTML 마크업
  </text>
  <text x="460" y="64" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    HTML은 소스 코드의 여러 줄바꿈(Enter)과 다중 공백(Space)을 1칸으로만 인식합니다
  </text>

  <!-- LEFT PANEL: 태그 없이 일반 텍스트만 입력한 경우 -->
  <g transform="translate(35, 88)" filter="url(#shadow2_3)">
    <rect width="410" height="340" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="38" rx="12" fill="url(#redTitleGrad)"/>
    <text x="20" y="24" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">
      ❌ 태그 없이 일반 텍스트만 입력 시
    </text>

    <!-- Source Code Window Mockup -->
    <g transform="translate(15, 50)">
      <rect width="380" height="120" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="12" y="20" fill="#94a3b8" font-size="10" font-family="monospace">에디터 소스 코드 (web.html)</text>
      <line x1="0" y1="28" x2="380" y2="28" stroke="#334155" stroke-width="1"/>
      
      <text x="15" y="48" fill="#f8fafc" font-size="11" font-family="monospace">웹 개발 기초 <tspan fill="#ef4444">[Enter 줄바꿈]</tspan></text>
      <text x="15" y="68" fill="#f8fafc" font-size="11" font-family="monospace">H       TML <tspan fill="#ef4444">[다중 공백 + 줄바꿈]</tspan></text>
      <text x="15" y="88" fill="#f8fafc" font-size="11" font-family="monospace">CSS <tspan fill="#ef4444">[Enter 줄바꿈]</tspan></text>
      <text x="15" y="108" fill="#f8fafc" font-size="11" font-family="monospace">자바스크립트</text>
    </g>

    <!-- Arrow down -->
    <text x="205" y="193" text-anchor="middle" fill="#f87171" font-size="18">⬇ 브라우저 렌더링 결과</text>

    <!-- Browser Output Window Mockup -->
    <g transform="translate(15, 205)">
      <rect width="380" height="115" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="380" height="22" rx="6" fill="#f1f5f9"/>
      <circle cx="12" cy="11" r="3.5" fill="#ef4444"/>
      <circle cx="23" cy="11" r="3.5" fill="#f59e0b"/>
      <circle cx="34" cy="11" r="3.5" fill="#10b981"/>
      <text x="50" y="15" fill="#64748b" font-size="9" font-family="sans-serif">크롬 브라우저 창</text>
      
      <!-- Rendered Output: All in one single line -->
      <g transform="translate(15, 45)">
        <text x="0" y="0" fill="#0f172a" font-size="12" font-family="sans-serif">
          웹 개발 기초 H TML CSS 자바스크립트
        </text>
        <rect x="-4" y="15" width="355" height="42" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
        <text x="5" y="32" fill="#991b1b" font-size="10.5" font-weight="bold" font-family="sans-serif">
          ⚠️ 줄바꿈이 무시되고, 공백은 1칸만 인식됨!
        </text>
        <text x="5" y="48" fill="#b91c1c" font-size="9.5" font-family="sans-serif">
          브라우저는 텍스트만 보고는 제목인지 본문인지 구분 못함
        </text>
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: HTML 태그로 마크업한 경우 -->
  <g transform="translate(475, 88)" filter="url(#shadow2_3)">
    <rect width="410" height="340" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="38" rx="12" fill="url(#greenTitleGrad)"/>
    <text x="20" y="24" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">
      ✔ HTML 태그(&lt;h1&gt;, &lt;p&gt;)로 마크업한 경우
    </text>

    <!-- Source Code Window Mockup -->
    <g transform="translate(15, 50)">
      <rect width="380" height="120" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="12" y="20" fill="#94a3b8" font-size="10" font-family="monospace">에디터 소스 코드 (web.html)</text>
      <line x1="0" y1="28" x2="380" y2="28" stroke="#334155" stroke-width="1"/>
      
      <text x="15" y="48" font-size="11" font-family="monospace">
        <tspan fill="#818cf8">&lt;h1&gt;</tspan><tspan fill="#f8fafc">웹 개발 기초</tspan><tspan fill="#818cf8">&lt;/h1&gt;</tspan>
      </text>
      <text x="15" y="68" font-size="11" font-family="monospace">
        <tspan fill="#818cf8">&lt;p&gt;</tspan><tspan fill="#f8fafc">HTML</tspan><tspan fill="#818cf8">&lt;/p&gt;</tspan>
      </text>
      <text x="15" y="88" font-size="11" font-family="monospace">
        <tspan fill="#818cf8">&lt;p&gt;</tspan><tspan fill="#f8fafc">CSS</tspan><tspan fill="#818cf8">&lt;/p&gt;</tspan>
      </text>
      <text x="15" y="108" font-size="11" font-family="monospace">
        <tspan fill="#818cf8">&lt;p&gt;</tspan><tspan fill="#f8fafc">자바스크립트</tspan><tspan fill="#818cf8">&lt;/p&gt;</tspan>
      </text>
    </g>

    <!-- Arrow down -->
    <text x="205" y="193" text-anchor="middle" fill="#34d399" font-size="18">⬇ 브라우저 렌더링 결과</text>

    <!-- Browser Output Window Mockup -->
    <g transform="translate(15, 205)">
      <rect width="380" height="115" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="380" height="22" rx="6" fill="#f1f5f9"/>
      <circle cx="12" cy="11" r="3.5" fill="#ef4444"/>
      <circle cx="23" cy="11" r="3.5" fill="#f59e0b"/>
      <circle cx="34" cy="11" r="3.5" fill="#10b981"/>
      <text x="50" y="15" fill="#64748b" font-size="9" font-family="sans-serif">크롬 브라우저 창</text>
      
      <!-- Rendered Output: Structured properly -->
      <g transform="translate(15, 45)">
        <text x="0" y="0" fill="#0f172a" font-size="15" font-weight="bold" font-family="sans-serif">
          웹 개발 기초
        </text>
        <text x="0" y="18" fill="#334155" font-size="11" font-family="sans-serif">HTML</text>
        <text x="0" y="34" fill="#334155" font-size="11" font-family="sans-serif">CSS</text>
        <text x="0" y="50" fill="#334155" font-size="11" font-family="sans-serif">자바스크립트</text>

        <rect x="180" y="2" width="170" height="55" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
        <text x="188" y="20" fill="#065f46" font-size="10" font-weight="bold" font-family="sans-serif">
          ✨ 의도대로 정상 렌더링!
        </text>
        <text x="188" y="36" fill="#047857" font-size="9" font-family="sans-serif">
          • &lt;h1&gt;: 굵고 큰 제목으로 처리
        </text>
        <text x="188" y="50" fill="#047857" font-size="9" font-family="sans-serif">
          • &lt;p&gt;: 각자 단락 분리 및 줄바꿈
        </text>
      </g>
    </g>
  </g>
</svg>
