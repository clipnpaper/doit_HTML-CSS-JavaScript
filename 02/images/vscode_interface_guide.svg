<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueBarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007acc"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
    <filter id="shadow2_2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="480" rx="16" fill="url(#bgGrad2_2)"/>
  <rect x="1" y="1" width="918" height="478" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    Visual Studio Code 개발 환경 및 핵심 인터페이스 가이드
  </text>
  <text x="460" y="60" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    탐색기 활용, 새 파일 생성, 미저장 상태(●) 확인, 화면 분할(Split Editor) 비교 실습
  </text>

  <!-- VS CODE MOCKUP WINDOW -->
  <g transform="translate(35, 75)" filter="url(#shadow2_2)">
    <!-- Window Frame -->
    <rect width="850" height="380" rx="10" fill="#181824" stroke="#3b4252" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="850" height="32" rx="10" fill="#202230"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444"/>
    <circle cx="36" cy="16" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="16" r="5" fill="#10b981"/>
    <text x="425" y="21" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">
      index.html - doit_HTML-CSS-JavaScript - Visual Studio Code
    </text>

    <!-- 1. Activity Bar (Leftmost icon strip) -->
    <rect x="0" y="32" width="46" height="326" fill="#161822"/>
    <line x1="46" y1="32" x2="46" y2="358" stroke="#2e3440" stroke-width="1"/>
    <!-- Icons -->
    <text x="23" y="65" text-anchor="middle" fill="#38bdf8" font-size="18">📁</text>
    <text x="23" y="105" text-anchor="middle" fill="#64748b" font-size="16">🔍</text>
    <text x="23" y="145" text-anchor="middle" fill="#64748b" font-size="16">🌿</text>
    <text x="23" y="185" text-anchor="middle" fill="#64748b" font-size="16">🐞</text>
    <text x="23" y="225" text-anchor="middle" fill="#64748b" font-size="16">🧩</text>
    <text x="23" y="340" text-anchor="middle" fill="#64748b" font-size="16">⚙️</text>

    <!-- 2. Side Bar: Explorer -->
    <rect x="46" y="32" width="200" height="326" fill="#1b1d2a"/>
    <line x1="246" y1="32" x2="246" y2="358" stroke="#2e3440" stroke-width="1"/>
    <text x="60" y="55" fill="#cbd5e1" font-size="11" font-weight="bold" font-family="sans-serif">탐색기: DOIT_HCJ</text>
    <!-- New File / New Folder Icons -->
    <g transform="translate(195, 43)">
      <text x="0" y="11" fill="#38bdf8" font-size="12" font-weight="bold">📄+</text>
      <text x="22" y="11" fill="#94a3b8" font-size="12">📁+</text>
    </g>

    <!-- Folder Tree -->
    <g transform="translate(60, 75)" font-family="sans-serif" font-size="11">
      <text x="0" y="15" fill="#94a3b8">v 📂 02</text>
      <!-- Subfiles under 02 -->
      <g transform="translate(18, 20)">
        <rect x="-4" y="2" width="165" height="22" rx="4" fill="#282e3f"/>
        <text x="2" y="17" fill="#38bdf8">📄 index.html</text>
        <text x="2" y="37" fill="#cbd5e1">📄 web.html</text>
      </g>
      <text x="0" y="80" fill="#64748b">&gt; 📁 03</text>
      <text x="0" y="100" fill="#64748b">&gt; 📁 04</text>
      <text x="0" y="120" fill="#64748b">&gt; 📁 05 ... 17</text>
    </g>

    <!-- Explorer Annotation Box -->
    <rect x="52" y="235" width="188" height="110" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#0284c7" stroke-width="1"/>
    <text x="62" y="255" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif">💡 작업 폴더 열기 팁</text>
    <text x="62" y="273" fill="#cbd5e1" font-size="9.5" font-family="sans-serif">• 윈도우 탐색기에서 폴더를</text>
    <text x="62" y="287" fill="#cbd5e1" font-size="9.5" font-family="sans-serif">  VS Code로 드래그 앤 드롭</text>
    <text x="62" y="303" fill="#cbd5e1" font-size="9.5" font-family="sans-serif">• 파일 &gt; 폴더 열기 메뉴 이용</text>
    <text x="62" y="321" fill="#fb923c" font-size="9.5" font-family="sans-serif">• [📄+] 아이콘으로 새 파일 생성</text>
    <text x="62" y="335" fill="#94a3b8" font-size="9" font-family="sans-serif">  (반드시 .html 확장자 입력)</text>

    <!-- 3. Editor Tabs & Split Windows -->
    <!-- Left Editor (50% width) -->
    <rect x="246" y="32" width="300" height="326" fill="#1e2233"/>
    <!-- Left Tab -->
    <rect x="246" y="32" width="150" height="30" fill="#1e2233" stroke="#2e3440" stroke-width="0.5"/>
    <text x="260" y="52" fill="#f8fafc" font-size="11" font-family="monospace">web.html</text>
    <!-- Unsaved Dot indicator -->
    <circle cx="330" cy="48" r="4" fill="#ffffff"/>
    <text x="355" y="52" fill="#64748b" font-size="11">×</text>

    <!-- Left Code Content -->
    <g transform="translate(256, 75)" font-family="monospace" font-size="11">
      <text x="0" y="15" fill="#64748b">1</text>
      <text x="20" y="15" fill="#818cf8">&lt;h1&gt;</text>
      <text x="50" y="15" fill="#f8fafc">웹 개발 기초</text>
      <text x="135" y="15" fill="#818cf8">&lt;/h1&gt;</text>

      <text x="0" y="35" fill="#64748b">2</text>
      <text x="20" y="35" fill="#818cf8">&lt;p&gt;</text>
      <text x="45" y="35" fill="#f8fafc">HTML</text>
      <text x="80" y="35" fill="#818cf8">&lt;/p&gt;</text>

      <text x="0" y="55" fill="#64748b">3</text>
      <text x="20" y="55" fill="#818cf8">&lt;p&gt;</text>
      <text x="45" y="55" fill="#f8fafc">CSS</text>
      <text x="75" y="55" fill="#818cf8">&lt;/p&gt;</text>

      <text x="0" y="75" fill="#64748b">4</text>
      <text x="20" y="75" fill="#818cf8">&lt;p&gt;</text>
      <text x="45" y="75" fill="#f8fafc">자바스크립트</text>
      <text x="135" y="75" fill="#818cf8">&lt;/p&gt;</text>
    </g>

    <!-- Save Alert Callout -->
    <g transform="translate(255, 175)">
      <rect width="280" height="42" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <text x="10" y="18" fill="#fca5a5" font-size="10" font-weight="bold" font-family="sans-serif">⚠️ 탭의 하얀 동그라미(●)는 미저장 상태!</text>
      <text x="10" y="33" fill="#fecaca" font-size="9.5" font-family="sans-serif">반드시 <tspan font-weight="bold" fill="#ffffff">Ctrl + S</tspan> 를 눌러 수시로 저장해야 브라우저에 반영됨</text>
    </g>

    <!-- Right Editor: Split View (Comparing Code) -->
    <rect x="546" y="32" width="304" height="326" fill="#1b1f2e"/>
    <line x1="546" y1="32" x2="546" y2="358" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Right Tab -->
    <rect x="546" y="32" width="160" height="30" fill="#1b1f2e" stroke="#2e3440" stroke-width="0.5"/>
    <text x="560" y="52" fill="#34d399" font-size="11" font-family="monospace">index.html (완성본)</text>
    <text x="685" y="52" fill="#64748b" font-size="11">×</text>

    <!-- Split view badge -->
    <rect x="720" y="37" width="120" height="20" rx="4" fill="#0284c7" fill-opacity="0.3"/>
    <text x="780" y="51" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="bold" font-family="sans-serif">✨ 화면 분할 비교</text>

    <!-- Right Code Content -->
    <g transform="translate(556, 75)" font-family="monospace" font-size="10.5">
      <text x="0" y="15" fill="#64748b">1</text>
      <text x="18" y="15" fill="#fb923c">&lt;!DOCTYPE html&gt;</text>
      
      <text x="0" y="33" fill="#64748b">2</text>
      <text x="18" y="33" fill="#818cf8">&lt;html <tspan fill="#38bdf8">lang</tspan>=<tspan fill="#34d399">"ko"</tspan>&gt;</text>

      <text x="0" y="51" fill="#64748b">3</text>
      <text x="18" y="51" fill="#818cf8">&lt;head&gt; &lt;meta charset="UTF-8"&gt; ... &lt;/head&gt;</text>

      <text x="0" y="69" fill="#64748b">4</text>
      <text x="18" y="69" fill="#818cf8">&lt;body&gt;</text>

      <text x="0" y="87" fill="#64748b">5</text>
      <text x="25" y="87" fill="#818cf8">&lt;h1&gt;</text><text x="55" y="87" fill="#f8fafc">웹 개발 기초</text><text x="135" y="87" fill="#818cf8">&lt;/h1&gt;</text>
    </g>

    <!-- Split View Tip Callout -->
    <g transform="translate(555, 175)">
      <rect width="285" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="18" fill="#6ee7b7" font-size="10" font-weight="bold" font-family="sans-serif">💡 측면에서 열기 (Split Editor)</text>
      <text x="10" y="33" fill="#a7f3d0" font-size="9.5" font-family="sans-serif">파일 우클릭 &gt; '측면에서 열기'로 내 코드와 정답 비교!</text>
    </g>

    <!-- Status Bar (Bottom) -->
    <rect x="0" y="358" width="850" height="22" rx="0" fill="url(#blueBarGrad)"/>
    <text x="15" y="373" fill="#ffffff" font-size="10" font-family="sans-serif">공간: doit_HTML-CSS-JavaScript</text>
    <text x="730" y="373" fill="#ffffff" font-size="10" font-family="monospace">UTF-8 | HTML | LF</text>
  </g>
</svg>
