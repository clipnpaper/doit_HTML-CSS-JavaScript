<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowRight" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowLeft" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="918" height="458" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    클라이언트와 서버 &amp; 프런트엔드 vs 백엔드 아키텍처
  </text>
  <text x="460" y="66" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    정보를 요청하는 '클라이언트(프런트엔드)'와 정보를 처리하여 제공하는 '서버(백엔드)'의 협업 구조
  </text>

  <!-- CLIENT / FRONTEND BOX -->
  <g transform="translate(40, 95)" filter="url(#glow)">
    <rect width="260" height="325" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="46" rx="14" fill="url(#clientGrad)"/>
    <text x="130" y="28" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif">클라이언트 (Client)</text>

    <!-- Subtitle badge -->
    <rect x="55" y="58" width="150" height="26" rx="13" fill="#0284c7" fill-opacity="0.25"/>
    <text x="130" y="75" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif">눈에 보이는 프런트엔드</text>

    <!-- Devices Icon/List -->
    <g transform="translate(20, 98)">
      <rect width="220" height="85" rx="8" fill="#0f172a" fill-opacity="0.8"/>
      <text x="15" y="24" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif">접속 기기 (User Devices)</text>
      <text x="15" y="45" fill="#f1f5f9" font-size="12" font-family="sans-serif">💻 데스크톱 PC &amp; 노트북</text>
      <text x="15" y="63" fill="#f1f5f9" font-size="12" font-family="sans-serif">📱 스마트폰 &amp; 태블릿</text>
      <text x="15" y="80" fill="#f1f5f9" font-size="12" font-family="sans-serif">🚗 스마트 가전 / 차량 디스플레이</text>
    </g>

    <!-- Tech Stack -->
    <g transform="translate(20, 195)">
      <rect width="220" height="110" rx="8" fill="#0f172a" fill-opacity="0.8"/>
      <text x="15" y="24" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif">프런트엔드 핵심 기술</text>
      <text x="15" y="47" fill="#e0f2fe" font-size="12" font-family="sans-serif">📄 <tspan font-weight="bold" fill="#38bdf8">HTML</tspan> : 웹 문서의 뼈대와 구조</text>
      <text x="15" y="68" fill="#e0f2fe" font-size="12" font-family="sans-serif">🎨 <tspan font-weight="bold" fill="#38bdf8">CSS</tspan> : 시각 디자인 &amp; 레이아웃</text>
      <text x="15" y="89" fill="#e0f2fe" font-size="12" font-family="sans-serif">⚡ <tspan font-weight="bold" fill="#38bdf8">자바스크립트</tspan> : 동적 인터랙션</text>
      <text x="15" y="106" fill="#94a3b8" font-size="10" font-family="sans-serif">↳ React, Vue, Angular 등 확장</text>
    </g>
  </g>

  <!-- MIDDLE: INTERNET / PROTOCOL FLOW -->
  <g transform="translate(325, 125)">
    <!-- Cloud Icon/Shape -->
    <path d="M 40 50 Q 20 50 15 70 Q 5 75 10 95 Q 10 115 35 115 L 235 115 Q 260 115 260 95 Q 265 75 250 65 Q 240 45 220 50 Q 200 30 170 38 Q 145 25 115 35 Q 90 25 70 40 Q 50 40 40 50 Z" 
          fill="#1e293b" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="135" y="78" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold" font-family="sans-serif">인터넷 (Internet)</text>
    <text x="135" y="96" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">전 세계를 잇는 네트워크</text>

    <!-- Request Arrow -->
    <g transform="translate(0, 140)">
      <line x1="5" y1="20" x2="260" y2="20" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowRight)"/>
      <rect x="65" y="5" width="140" height="30" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
      <text x="135" y="24" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="bold" font-family="sans-serif">
        요청 (Request) →
      </text>
      <text x="135" y="47" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">
        "이 웹페이지 정보 보여줘!"
      </text>
    </g>

    <!-- Response Arrow -->
    <g transform="translate(0, 215)">
      <line x1="260" y1="20" x2="5" y2="20" stroke="#34d399" stroke-width="3" marker-end="url(#arrowLeft)"/>
      <rect x="65" y="5" width="140" height="30" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="135" y="24" text-anchor="middle" fill="#d1fae5" font-size="11" font-weight="bold" font-family="sans-serif">
        ← 응답 (Response)
      </text>
      <text x="135" y="47" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">
        HTML/CSS/JS 데이터 전송
      </text>
    </g>
  </g>

  <!-- SERVER / BACKEND BOX -->
  <g transform="translate(620, 95)" filter="url(#glow)">
    <rect width="260" height="325" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="46" rx="14" fill="url(#serverGrad)"/>
    <text x="130" y="28" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif">서버 (Server)</text>

    <!-- Subtitle badge -->
    <rect x="55" y="58" width="150" height="26" rx="13" fill="#7e22ce" fill-opacity="0.3"/>
    <text x="130" y="75" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="bold" font-family="sans-serif">보이지 않는 백엔드</text>

    <!-- Database section -->
    <g transform="translate(20, 98)">
      <rect width="220" height="85" rx="8" fill="#0f172a" fill-opacity="0.8"/>
      <text x="15" y="24" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif">데이터베이스 (Database)</text>
      <text x="15" y="45" fill="#f1f5f9" font-size="12" font-family="sans-serif">📦 상품 정보 및 재고 데이터</text>
      <text x="15" y="63" fill="#f1f5f9" font-size="12" font-family="sans-serif">👤 회원 계정 &amp; 인증 데이터</text>
      <text x="15" y="80" fill="#f1f5f9" font-size="12" font-family="sans-serif">🚚 배송 및 주문 내역 데이터</text>
    </g>

    <!-- Tech Stack -->
    <g transform="translate(20, 195)">
      <rect width="220" height="110" rx="8" fill="#0f172a" fill-opacity="0.8"/>
      <text x="15" y="24" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif">백엔드 핵심 기술 &amp; 언어</text>
      <text x="15" y="47" fill="#f3e8ff" font-size="12" font-family="sans-serif">☕ <tspan font-weight="bold" fill="#c084fc">Java / Spring</tspan></text>
      <text x="15" y="68" fill="#f3e8ff" font-size="12" font-family="sans-serif">🐍 <tspan font-weight="bold" fill="#c084fc">Python (Django / FastAPI)</tspan></text>
      <text x="15" y="89" fill="#f3e8ff" font-size="12" font-family="sans-serif">🟢 <tspan font-weight="bold" fill="#c084fc">Node.js (자바스크립트 서버)</tspan></text>
      <text x="15" y="106" fill="#94a3b8" font-size="10" font-family="sans-serif">🐘 PHP, Ruby, Go, MySQL 등</text>
    </g>
  </g>
</svg>
