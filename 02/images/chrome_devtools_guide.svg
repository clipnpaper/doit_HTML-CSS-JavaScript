<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow2_4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="480" rx="16" fill="url(#bgGrad2_4)"/>
  <rect x="1" y="1" width="918" height="478" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    웹 개발자의 필수 무기: 크롬 개발자 도구 (Chrome DevTools)
  </text>
  <text x="460" y="60" text-anchor="middle" fill="#94a3b8" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    우클릭 [검사] · 요소(Elements) 실시간 하이라이트 · 접기/펼치기 · 콘솔(Console) 테스트
  </text>

  <!-- BROWSER + DEVTOOLS MOCKUP -->
  <g transform="translate(35, 75)" filter="url(#shadow2_4)">
    <rect width="850" height="385" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Chrome Header -->
    <rect width="850" height="34" rx="10" fill="#f1f5f9"/>
    <circle cx="18" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="32" cy="17" r="4.5" fill="#f59e0b"/>
    <circle cx="46" cy="17" r="4.5" fill="#10b981"/>
    
    <!-- Address Bar -->
    <rect x="65" y="7" width="550" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="75" y="21" fill="#475569" font-size="10.5" font-family="monospace">file:///c:/workspaces/doit_HTML-CSS-JavaScript/02/index.html</text>
    <text x="825" y="21" fill="#64748b" font-size="13">⋮</text>

    <!-- UPPER HALF: WEB PAGE CONTENT (VIEWPORT) -->
    <g transform="translate(0, 34)">
      <rect width="850" height="150" fill="#ffffff"/>
      
      <!-- H1 Element (Highlighted by DevTools Hover) -->
      <g transform="translate(30, 25)">
        <!-- Blue highlight box for hovered H1 -->
        <rect x="-8" y="-6" width="380" height="38" rx="4" fill="#38bdf8" fill-opacity="0.35" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,2"/>
        <!-- Tag overlay badge -->
        <rect x="300" y="-18" width="70" height="18" rx="3" fill="#0284c7"/>
        <text x="335" y="-5" text-anchor="middle" fill="#ffffff" font-size="9.5" font-family="monospace">h1 | 380×32</text>
        
        <text x="0" y="20" fill="#0f172a" font-size="20" font-weight="bold" font-family="sans-serif">
          웹 개발 기초
        </text>
      </g>

      <!-- P Elements -->
      <g transform="translate(30, 75)" font-family="sans-serif" font-size="13" fill="#334155">
        <text x="0" y="16">HTML</text>
        <text x="0" y="38">CSS</text>
        <text x="0" y="60">자바스크립트</text>
      </g>

      <!-- Hover interaction callout arrow -->
      <g transform="translate(520, 35)">
        <rect width="300" height="85" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="15" y="24" fill="#1d4ed8" font-size="11.5" font-weight="bold" font-family="sans-serif">
          🎯 실시간 요소 호버(Hover) 기능
        </text>
        <text x="15" y="44" fill="#1e40af" font-size="10.5" font-family="sans-serif">
          아래 [요소] 탭에서 태그 위에 마우스를 올리면,
        </text>
        <text x="15" y="60" fill="#1e40af" font-size="10.5" font-family="sans-serif">
          화면 상에서 해당 요소의 위치와 크기가
        </text>
        <text x="15" y="76" fill="#2563eb" font-size="10.5" font-weight="bold" font-family="sans-serif">
          하늘색 박스로 즉시 하이라이트 표시됩니다!
        </text>
      </g>
    </g>

    <!-- DIVIDER: DEVTOOLS DRAG BAR -->
    <rect x="0" y="184" width="850" height="6" fill="#e2e8f0"/>
    <line x1="410" y1="187" x2="440" y2="187" stroke="#94a3b8" stroke-width="2"/>

    <!-- LOWER HALF: DEVTOOLS PANEL (DARK THEME) -->
    <g transform="translate(0, 190)">
      <rect width="850" height="195" rx="0" fill="#202124"/>
      
      <!-- DevTools Tab Header -->
      <rect width="850" height="28" fill="#292a2d"/>
      <g transform="translate(15, 18)" font-family="sans-serif" font-size="11">
        <text x="0" y="0" fill="#8ab4f8" font-weight="bold">요소 (Elements)</text>
        <rect x="-4" y="8" width="88" height="2" fill="#8ab4f8"/>
        
        <text x="110" y="0" fill="#9aa0a6">콘솔 (Console)</text>
        <text x="210" y="0" fill="#9aa0a6">소스 (Sources)</text>
        <text x="310" y="0" fill="#9aa0a6">네트워크 (Network)</text>
        <text x="430" y="0" fill="#9aa0a6">성능 (Performance)</text>
      </g>

      <!-- Elements DOM Tree (Left 60%) -->
      <g transform="translate(15, 45)" font-family="monospace" font-size="10.5">
        <text x="0" y="12" fill="#7da4f8">&lt;!DOCTYPE html&gt;</text>
        <text x="0" y="28" fill="#7da4f8">▼ &lt;html <tspan fill="#e8eaed">lang=</tspan><tspan fill="#81c995">"ko"</tspan>&gt;</text>
        <text x="15" y="44" fill="#7da4f8">▶ &lt;head&gt;...&lt;/head&gt;</text>
        <text x="15" y="60" fill="#7da4f8">▼ &lt;body&gt;</text>
        
        <!-- Currently Hovered H1 Line -->
        <rect x="25" y="66" width="380" height="18" fill="#2d3748" rx="3"/>
        <text x="30" y="79" fill="#7da4f8">
          &lt;h1&gt;<tspan fill="#e8eaed">웹 개발 기초</tspan>&lt;/h1&gt;  <tspan fill="#68d391" font-size="9">&lt;-- 마우스 커서 위치!</tspan>
        </text>

        <text x="30" y="98" fill="#7da4f8">&lt;p&gt;<tspan fill="#e8eaed">HTML</tspan>&lt;/p&gt;</text>
        <text x="30" y="114" fill="#7da4f8">&lt;p&gt;<tspan fill="#e8eaed">CSS</tspan>&lt;/p&gt;</text>
        <text x="30" y="130" fill="#7da4f8">&lt;p&gt;<tspan fill="#e8eaed">자바스크립트</tspan>&lt;/p&gt;</text>
        <text x="15" y="146" fill="#7da4f8">&lt;/body&gt;</text>
      </g>

      <!-- Vertical divider -->
      <line x1="480" y1="28" x2="480" y2="195" stroke="#3c4043" stroke-width="1"/>

      <!-- Right Panel: Shortcuts & Styles info -->
      <g transform="translate(500, 42)">
        <text x="0" y="12" fill="#8ab4f8" font-size="11.5" font-weight="bold" font-family="sans-serif">
          ⚡ 개발자 도구 실행 단축키
        </text>
        <rect x="0" y="22" width="325" height="115" rx="6" fill="#292a2d" stroke="#3c4043" stroke-width="1"/>
        
        <text x="15" y="44" fill="#e8eaed" font-size="10.5" font-family="sans-serif">
          1. <tspan fill="#81c995" font-weight="bold">우클릭 &gt; [검사 (Inspect)]</tspan> : 가장 추천!
        </text>
        <text x="15" y="66" fill="#e8eaed" font-size="10.5" font-family="sans-serif">
          2. <tspan fill="#f6ad55" font-weight="bold">Ctrl + Shift + I</tspan> (Mac: Cmd + Opt + I)
        </text>
        <text x="15" y="88" fill="#e8eaed" font-size="10.5" font-family="sans-serif">
          3. <tspan fill="#f6ad55" font-weight="bold">F12</tspan> 키 누르기
        </text>
        <text x="15" y="112" fill="#9aa0a6" font-size="9.5" font-family="sans-serif">
          • 소스코드 접기/펼치기: 화살표(▶ / ▼) 클릭
        </text>
        <text x="15" y="127" fill="#9aa0a6" font-size="9.5" font-family="sans-serif">
          • [콘솔] 탭에서 실시간 자바스크립트 실행 가능
        </text>
      </g>
    </g>
  </g>
</svg>
